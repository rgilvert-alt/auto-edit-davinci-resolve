name: Bug report
description: Something crashed or behaved incorrectly
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Include OS, Python, Resolve (if relevant), and the exact step that failed.
  - type: input
    id: os
    attributes:
      label: OS / Python
      placeholder: "macOS 15 · Python 3.12"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Desktop UI (autoedit-ui)
        - CLI
        - MCP
        - Unsure
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. … 2. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual (error text / traceback)
    validations:
      required: true
